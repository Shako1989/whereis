services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whereis
      POSTGRES_USER: whereis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whereis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whereis -d whereis"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"        # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Full-stack mode: `docker compose --profile app up --build`
  backend:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/whereis
      DB_USERNAME: whereis
      DB_PASSWORD: ${DB_PASSWORD:-whereis}
      MINIO_ENDPOINT: http://minio:9000
      # Presigned URLs must point at a host the browser can reach:
      MINIO_EXTERNAL_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-item-images}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 bytes)}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.0}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      # Only read when AI_PROVIDER=claude; the app fails to start if the key is then missing.
      AI_CLAUDE_API_KEY: ${AI_CLAUDE_API_KEY:-}
      AI_CLAUDE_MODEL: ${AI_CLAUDE_MODEL:-claude-haiku-4-5}
      # No colon in the default: `:-` would replace a deliberately blank value with 0.0, and
      # blank is exactly how temperature is omitted for models that reject sampling.
      AI_CLAUDE_TEMPERATURE: ${AI_CLAUDE_TEMPERATURE-0.0}
      AI_CLAUDE_BASE_URL: ${AI_CLAUDE_BASE_URL:-}
      AI_CLAUDE_WORKSPACE_ID: ${AI_CLAUDE_WORKSPACE_ID:-}
      AI_CLAUDE_TIMEOUT: ${AI_CLAUDE_TIMEOUT:-15s}
      AI_CLAUDE_MAX_OUTPUT_TOKENS: ${AI_CLAUDE_MAX_OUTPUT_TOKENS:-4096}
      AI_CLAUDE_MAX_RETRIES: ${AI_CLAUDE_MAX_RETRIES:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
