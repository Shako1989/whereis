spring:
  application:
    name: whereis
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whereis}
    username: ${DB_USERNAME:whereis}
    password: ${DB_PASSWORD:whereis}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    connect-retries: 10
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        max-page-size: 100

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Must be at least 32 bytes; validated at startup.
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Endpoint reachable by browsers for presigned URLs; falls back to `endpoint` when blank.
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:item-images}
  presign-ttl: ${MINIO_PRESIGN_TTL:10m}

storage:
  janitor:
    delay: ${STORAGE_JANITOR_DELAY:PT60S}

ai:
  # mock (default, no key, no network) | openai (any OpenAI-compatible endpoint) | claude
  # (Anthropic Messages API). The keys below belong to the openai provider; claude reads
  # ai.claude.* instead, so switching providers never means reinterpreting the other's values.
  provider: ${AI_PROVIDER:mock}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  temperature: ${AI_TEMPERATURE:0.0}
  timeout: ${AI_TIMEOUT:30s}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:800}
  claude:
    # Required when ai.provider=claude; the app refuses to start without it.
    api-key: ${AI_CLAUDE_API_KEY:}
    # Blank means the SDK's own https://api.anthropic.com.
    base-url: ${AI_CLAUDE_BASE_URL:}
    # Required ONLY for an identity-linked API key, which the API rejects with a 400 unless the
    # request names the workspace it acts in. Leave blank for a workspace-scoped key.
    workspace-id: ${AI_CLAUDE_WORKSPACE_ID:}
    model: ${AI_CLAUDE_MODEL:claude-haiku-4-5}
    # Deterministic extraction, and legal on Haiku 4.5. Set this to blank to omit the
    # parameter from the request entirely: Opus 4.7 and later (4.7, 4.8, Opus 5), Sonnet 5 and
    # the Fable family reject sampling parameters with a 400. Opus 4.6 and Sonnet 4.6 accept them.
    temperature: ${AI_CLAUDE_TEMPERATURE:0.0}
    timeout: ${AI_CLAUDE_TIMEOUT:15s}
    max-output-tokens: ${AI_CLAUDE_MAX_OUTPUT_TOKENS:4096}
    # One retry, not the SDK default of two: /assistant/remember is synchronous.
    max-retries: ${AI_CLAUDE_MAX_RETRIES:1}

# The facts the public legal pages state. Deployment configuration, not source: the repository
# is public, and these are rendered into the pages at startup rather than committed into them.
# The defaults below are deliberately UNUSABLE (.invalid is reserved by RFC 2606 for exactly this)
# so a build that reaches a user with them still in place is obvious. application-prod.yml declares
# every one with no default, so the prod profile cannot start without real values.
whereis:
  legal:
    support-email: ${WHEREIS_LEGAL_SUPPORT_EMAIL:support@example.invalid}
    legal-entity: ${WHEREIS_LEGAL_ENTITY:whereis (development build)}
    legal-address: ${WHEREIS_LEGAL_ADDRESS:not set in a development build}
    effective-date: ${WHEREIS_LEGAL_EFFECTIVE_DATE:1970-01-01}
    backup-retention-days: ${WHEREIS_LEGAL_BACKUP_RETENTION_DAYS:0}
    # How long a Google purchase token is kept after the account is gone, while the cancellation is
    # retried. The SAME number PlayCancellationJanitor gives up after — it reads this property, so
    # the page and the code cannot drift. Stated on /legal/delete-account in both languages.
    cancellation-retry-days: ${WHEREIS_LEGAL_CANCELLATION_RETRY_DAYS:7}
    # How long a Google Play billing notification stays in the RTDN ledger (play_notifications).
    # Stated on both public pages in both languages, and read by PlayNotificationJanitor as its
    # cutoff — one value, so the page cannot lie. It has a FLOOR the janitor refuses to boot under:
    # Pub/Sub retains an unacknowledged message for up to 7 days and the ledger's primary key is
    # what makes a redelivery a no-op, so a window of 7 days or less trades the promise for a
    # double-applied notification. 30 days is four times that floor and one billing cycle, which is
    # the window in which a disputed charge is actually diagnosed from these payloads.
    billing-log-retention-days: ${WHEREIS_LEGAL_BILLING_LOG_RETENTION_DAYS:30}

  # The tier ladder. Product rules rather than deployment secrets, so they are plain values here
  # instead of .env placeholders — relaxed binding still lets WHEREIS_PLANS_PRO_ITEMS retune a
  # number during closed testing without a code change (see deploy/README.md Step 10; raising a
  # LOWER tier means raising every tier above it, or startup fails with a message naming both).
  #
  # A BLANK/ABSENT limit means NO CEILING ON THAT ALLOWANCE — which is the only way `max`
  # ("10 spaces, unlimited items") is expressible at all. Only ACTIVE items count towards `items`
  # (archiving frees room); locations are deliberately not limited.
  #
  # `unlimited` is the OPERATOR GRANT (users.plan = 'UNLIMITED', deploy/README.md Step 10). It has
  # no product-id and never will: it is not purchasable, and GET /api/v1/plans omits it.
  plans:
    free:
      spaces: 1
      items: 100
      listings: 1
    standard:
      spaces: 3
      items: 300
      listings: 3
      product-id: whereis_standard_annual
    pro:
      spaces: 5
      items: 600
      listings: 10
      product-id: whereis_pro_annual
    max:
      spaces: 10
      # Blank, not a big number: null is "no ceiling on THIS allowance". Max is ten spaces and
      # unlimited items, which a single all-or-nothing flag could not express.
      items:
      # ...and `listings` is deliberately NOT blank here. An unbounded PUBLIC surface per account
      # is a spam vector in a way an unbounded private inventory is not, so MAX has unlimited items
      # and a finite number of simultaneous listings. The asymmetry between these two lines is the
      # clearest demonstration of why a ceiling is nullable per ALLOWANCE rather than per tier, and
      # it also makes aHigherTierRaisesListings(MAX) false — so the 409 at MAX correctly offers no
      # upgrade instead of advertising a product that would not help.
      listings: 25
      product-id: whereis_max_annual
    # `unlimited` is deliberately ABSENT: the operator grant has no ceiling on ANY allowance
    # and no product-id, so there is nothing to configure. PlanCatalog supplies it and refuses to
    # start if this file ever gives it one.

  # The public marketplace board — the only endpoints in this application whose cost is not bounded
  # by an account, on a 768 MB container sharing a VM with a co-tenant application. The limiter is
  # in the application rather than at the edge because stock Caddy has no rate_limit directive and
  # the Caddy in front of this service belongs to that co-tenant. It DEPENDS on
  # `header_up X-Forwarded-For {remote_host}` in deploy/Caddyfile.whereis: reverse_proxy APPENDS by
  # default and Spring reads the FIRST entry, so without that line one curl header mints a fresh
  # budget per request.
  market:
    rate-limit:
      reads: ${WHEREIS_MARKET_READS_PER_MINUTE:30}
      reports: ${WHEREIS_MARKET_REPORTS_PER_HOUR:5}

  # Seller-level moderation (V13). WHO MAY BLOCK A SELLER, as a comma-separated e-mail allowlist,
  # and it FAILS CLOSED: this key unset — which is what every environment ships with until an
  # operator sets it — means NOBODY may moderate, never everybody. There is no role column in this
  # schema and no admin account; the operator is a user of their own application, so the JWT they
  # already hold is the credential and their e-mail is both the authorization check and the audit
  # value written into blocked_sellers.blocked_by.
  #
  # Compare against the STORED form: registration writes users.email through Names.normalize, and
  # ModerationProperties normalizes each entry the same way, so case and diacritics here cannot
  # silently match nobody. Deliberately NOT `${VAR:?}` in compose — a deployment with no moderator
  # configured is a legitimate (and safe) state, and the refusal that matters is the 403 at request
  # time, not a boot failure.
  marketplace:
    moderation:
      moderator-emails: ${WHEREIS_MARKETPLACE_MODERATOR_EMAILS:}

  # The Play Developer API, for verifying purchases. Same shape as ai.provider: a deterministic
  # fake is the default so `./gradlew build` and the whole integration suite run with no network,
  # no Google credentials and no Play Console — which does not exist yet. The fake is REFUSED under
  # the prod profile (its tokens are guessable literals), so a production process cannot select it.
  #
  # THREE values, and `disabled` is the one prod can run today: it needs no Google credentials,
  # answers every purchase 501 PLAY_BILLING_NOT_CONFIGURED, rejects every RTDN caller and stops the
  # three scheduled billing jobs — so it cannot grant a tier by any route, which is why it is
  # permitted under prod while `fake` is not. It must be paired with rtdn.verifier=disabled
  # (PlayBillingModeGuard refuses a half-configured deployment at startup). Free-tier limits,
  # GET /users/me/plan and 409 PLAN_LIMIT_REACHED are unaffected by it.
  play:
    # fake (default: deterministic, no key, no network) | google (real Play Developer API)
    # | disabled (billing not configured; refuses everything, grants nothing)
    provider: ${PLAY_PROVIDER:fake}
    # Server config, never a request field: a caller cannot make this server ask Google about a
    # different app's purchase.
    package-name: ${PLAY_PACKAGE_NAME:az.technest.whereis}
    # Required ONLY when provider=google; the app refuses to start without it, and nothing else in
    # the process reads it. Contents of the service-account key, from the environment.
    service-account-json: ${PLAY_SERVICE_ACCOUNT_JSON:}
    timeout: ${PLAY_TIMEOUT:10s}

    # POST /play/rtdn, the Cloud Pub/Sub push endpoint. TWO INDEPENDENT CHECKS, both required: a
    # shared secret in the push URL's query string, and Google's OIDC push token.
    #
    # Note what does NOT mirror whereis.play.provider: `verifier` defaults to `google`, not `fake`.
    # The failure modes are not symmetric — a fake Play API cannot grant anything until somebody
    # posts a token, while an unverified push endpoint IS a self-service entitlement grant. A blank
    # shared-secret, and a blank fake bearer, REJECT every request rather than skipping the check.
    rtdn:
      enabled: ${PLAY_RTDN_ENABLED:true}
      # google (verify Google's RS256 OIDC push token) | fake (one literal, refused under prod)
      # | disabled (deny every caller; PERMITTED under prod, and must be paired with
      # whereis.play.provider=disabled). Under `google` a blank shared-secret, audience or
      # service-account-email is a STARTUP FAILURE: blank rejects every push, which would silently
      # stop this deployment tracking Google. PlayRtdnConfig owns that check.
      verifier: ${PLAY_RTDN_VERIFIER:google}
      # Check 1. 32 random bytes, base64url; it is the ?key= of the registered push URL.
      shared-secret: ${PLAY_RTDN_SHARED_SECRET:}
      # Check 2's `aud`. MUST be an explicit opaque string set on the Pub/Sub subscription (e.g.
      # whereis-rtdn). Left blank there, Google sets aud to the full push URL — shared secret and
      # all — and PlayRtdnConfig refuses to boot on a URL-shaped value for exactly that reason.
      audience: ${PLAY_RTDN_AUDIENCE:}
      # Check 2's `email`: the service account the push subscription signs with.
      service-account-email: ${PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:}
      jwk-set-uri: ${PLAY_RTDN_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      # The fake verifier's literal. Blank rejects everything; tests set it explicitly.
      fake-bearer: ${PLAY_RTDN_FAKE_BEARER:}
      # MUST equal the literal in ix_play_notifications_unprocessed (V10: attempts < 10).
      # RtdnConfigurationTest parses V10 and fails if they drift.
      max-attempts: ${PLAY_RTDN_MAX_ATTEMPTS:10}
      max-payload-bytes: ${PLAY_RTDN_MAX_PAYLOAD_BYTES:262144}

    # Drift repair and the acknowledgement retry. Google auto-refunds an unacknowledged purchase
    # after 3 days — 5 MINUTES for a test purchase, i.e. every purchase on a closed track.
    reconcile:
      enabled: ${PLAY_RECONCILE_ENABLED:true}
      delay: ${PLAY_RECONCILE_DELAY:PT15M}
      initial-delay: ${PLAY_RECONCILE_INITIAL_DELAY:PT2M}
      batch-size: ${PLAY_RECONCILE_BATCH_SIZE:25}
      stale-after: ${PLAY_RECONCILE_STALE_AFTER:PT12H}
      graveyard: ${PLAY_RECONCILE_GRAVEYARD:P35D}
      ack-window: ${PLAY_RECONCILE_ACK_WINDOW:P7D}
      min-interval: ${PLAY_RECONCILE_MIN_INTERVAL:PT0.2S}

    # The refund backstop. A FIXED 7-day look-back, not a watermark: applying a void twice is a
    # no-op (voided_at is write-once), so a 28x-redundant window is free and self-heals after any
    # outage shorter than a week. Paced against the TIGHTER of Google's two documented quotas.
    voided-sweep:
      enabled: ${PLAY_VOIDED_SWEEP_ENABLED:true}
      cron: ${PLAY_VOIDED_SWEEP_CRON:0 17 */6 * * *}
      lookback: ${PLAY_VOIDED_SWEEP_LOOKBACK:P7D}
      max-pages: ${PLAY_VOIDED_SWEEP_MAX_PAGES:20}
      min-interval: ${PLAY_VOIDED_SWEEP_MIN_INTERVAL:PT2S}

    # Drains play_cancellation_queue: stops Google charging accounts that no longer exist. The
    # give-up deadline is deliberately NOT here — it is whereis.legal.cancellation-retry-days, the
    # same number the public page states.
    cancellation:
      enabled: ${PLAY_CANCELLATION_ENABLED:true}
      delay: ${PLAY_CANCELLATION_DELAY:PT5M}
      initial-delay: ${PLAY_CANCELLATION_INITIAL_DELAY:PT2M}
      batch-size: ${PLAY_CANCELLATION_BATCH_SIZE:20}

    # Ages rows out of the RTDN ledger. The WINDOW is deliberately not here — it is
    # whereis.legal.billing-log-retention-days, the same number both public pages state. This is
    # also the one scheduled billing component that does NOT check whether Play billing is
    # configured: it makes no Play call, and a deployment that switches billing off must still
    # purge the ledger it already accumulated.
    notification-retention:
      enabled: ${PLAY_NOTIFICATION_RETENTION_ENABLED:true}
      delay: ${PLAY_NOTIFICATION_RETENTION_DELAY:PT24H}
      initial-delay: ${PLAY_NOTIFICATION_RETENTION_INITIAL_DELAY:PT5M}
