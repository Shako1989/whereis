# whereis production stack — Hetzner VM, co-tenant of the AutoParts/BakuParts stack.
#
# This file deliberately defines ONE service. PostgreSQL, MinIO and Caddy are
# already running on the box from autoparts-api/deploy/docker-compose.prod.yml,
# and whereis reuses all three:
#   * postgres  -> its own `whereis` database + role (see README step 3)
#   * minio     -> its own private bucket + scoped user (README step 4)
#   * caddy     -> two extra vhosts (README step 5)
#
# There is no `depends_on`: Compose cannot depend across projects. The app tolerates
# a not-yet-ready database via `spring.flyway.connect-retries: 10` plus the restart
# policy below.
#
# Usage (on the VM, from this directory):
#   cp .env.example .env && nano .env
#   docker compose -f docker-compose.prod.yml --env-file .env build
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

name: whereis

services:
  whereis-api:
    image: whereis-api:${WHEREIS_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: whereis-api
    restart: unless-stopped

    # REQUIRED, not a tuning knob. The image sets -XX:MaxRAMPercentage=75, which
    # without a cgroup limit is 75% of TOTAL HOST RAM — on a 4GB CX22 that is ~3GB
    # of heap for this JVM alone and would OOM the box, taking BakuParts with it.
    # This cap is what that percentage resolves against.
    mem_limit: ${WHEREIS_MEM_LIMIT:-768m}

    # No `ports:` — the only way in is Caddy, over the shared network.
    networks:
      - shared

    environment:
      SPRING_PROFILES_ACTIVE: prod,json

      DB_URL: jdbc:postgresql://postgres:5432/${WHEREIS_DB_NAME:-whereis}
      DB_USERNAME: ${WHEREIS_DB_USER:-whereis}
      DB_PASSWORD: ${WHEREIS_DB_PASSWORD:?set WHEREIS_DB_PASSWORD in .env}

      JWT_SECRET: ${WHEREIS_JWT_SECRET:?set WHEREIS_JWT_SECRET in .env (>= 32 bytes)}
      JWT_ACCESS_TTL: ${WHEREIS_JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${WHEREIS_JWT_REFRESH_TTL:-30d}

      # Internal endpoint for SDK operations (upload/delete/head).
      MINIO_ENDPOINT: http://minio:9000
      # Public endpoint baked into presigned GET URLs handed to the Android app.
      # SigV4 signs the Host header, so this MUST match the Caddy vhost exactly.
      MINIO_EXTERNAL_ENDPOINT: https://${WHEREIS_MEDIA_HOST:?set WHEREIS_MEDIA_HOST in .env}
      MINIO_ACCESS_KEY: ${WHEREIS_MINIO_ACCESS_KEY:?set WHEREIS_MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${WHEREIS_MINIO_SECRET_KEY:?set WHEREIS_MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${WHEREIS_MINIO_BUCKET:-whereis-item-images}
      # The SECOND, world-readable bucket: metadata-stripped public copies of published marketplace
      # photos, at permanent unsigned URLs (V14).
      #
      # NO DEFAULT, AND THAT IS THE POINT — the same argument as PLAY_PROVIDER=disabled below.
      # Unset, published photos are switched off: listings publish, the board serves them without an
      # image, nothing fails to start and nothing 500s. A DEFAULT would be worse than no value,
      # because the bucket has to be created with an anonymous-read policy the application cannot
      # grant itself (README Step 4b) — so a name pointing at a bucket that does not exist yet would
      # turn `up -d` into a deployment where every publish answers 502.
      #
      # Colon-less: a blank value must stay blank rather than being substituted, because blank IS
      # the off switch. Set it in .env only AFTER Step 4b, and it must never equal
      # WHEREIS_MINIO_BUCKET — anonymous read is granted per BUCKET, so one bucket for both would
      # publish every private photo. The application refuses to start on that.
      MINIO_PUBLIC_BUCKET: ${WHEREIS_MINIO_PUBLIC_BUCKET-}
      # PRIVATE photos only. Deliberately untouched by V14: a published copy is never presigned, so
      # this governs exactly what it always did and raising it would widen every private link.
      MINIO_PRESIGN_TTL: ${WHEREIS_MINIO_PRESIGN_TTL:-10m}

      AI_PROVIDER: ${WHEREIS_AI_PROVIDER:-mock}
      AI_BASE_URL: ${WHEREIS_AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${WHEREIS_AI_API_KEY:-}
      AI_MODEL: ${WHEREIS_AI_MODEL:-gpt-4o-mini}
      # How many of the caller's own item names an assistant SEARCH hands to the model, so that a
      # description can reach an item named something else. Above this many ACTIVE items the list
      # is not sent and the older keyword search runs; 0 switches it off entirely, which is the
      # lever for a deployment that judges the per-search token cost or the disclosure too high.
      # Provider-independent: it bounds what LEAVES, so it applies to openai and claude alike.
      AI_MAX_ITEM_NAMES: ${WHEREIS_AI_MAX_ITEM_NAMES:-1000}
      # Read only when WHEREIS_AI_PROVIDER=claude. Left permissive here on purpose: the
      # required-key guard is provider-conditional, which compose interpolation cannot express,
      # so it lives in AiConfig and fails the container at startup with a named exception.
      AI_CLAUDE_API_KEY: ${WHEREIS_AI_CLAUDE_API_KEY:-}
      AI_CLAUDE_MODEL: ${WHEREIS_AI_CLAUDE_MODEL:-claude-haiku-4-5}
      AI_CLAUDE_TIMEOUT: ${WHEREIS_AI_CLAUDE_TIMEOUT:-15s}
      # No colon in the default: `:-` would replace a deliberately blank value with 0.0, and
      # blank is how temperature is omitted on a model that rejects sampling parameters.
      AI_CLAUDE_TEMPERATURE: ${WHEREIS_AI_CLAUDE_TEMPERATURE-0.0}
      AI_CLAUDE_MAX_OUTPUT_TOKENS: ${WHEREIS_AI_CLAUDE_MAX_OUTPUT_TOKENS:-4096}
      AI_CLAUDE_BASE_URL: ${WHEREIS_AI_CLAUDE_BASE_URL:-}

      # The facts the public legal pages state. `:?` on every one of them is deliberate, and
      # unlike the Play variables below they KEEP it: these are rendered into two public pages that
      # Google cross-checks, the app fails startup without them anyway, and — the deciding
      # difference — they are values the operator can supply TODAY. A `:?` is right exactly when a
      # missing value is a mistake rather than a fact about the world. The error also names the
      # missing variable instead of producing a Spring placeholder trace.
      # WHEREIS_LEGAL_BACKUP_RETENTION_DAYS is a promise to the user about how long deleted data
      # survives — it must match what the backup job on this box actually rotates.
      WHEREIS_LEGAL_SUPPORT_EMAIL: ${WHEREIS_LEGAL_SUPPORT_EMAIL:?set WHEREIS_LEGAL_SUPPORT_EMAIL in .env}
      WHEREIS_LEGAL_ENTITY: ${WHEREIS_LEGAL_ENTITY:?set WHEREIS_LEGAL_ENTITY in .env}
      WHEREIS_LEGAL_ADDRESS: ${WHEREIS_LEGAL_ADDRESS:?set WHEREIS_LEGAL_ADDRESS in .env}
      WHEREIS_LEGAL_EFFECTIVE_DATE: ${WHEREIS_LEGAL_EFFECTIVE_DATE:?set WHEREIS_LEGAL_EFFECTIVE_DATE in .env}
      WHEREIS_LEGAL_BACKUP_RETENTION_DAYS: ${WHEREIS_LEGAL_BACKUP_RETENTION_DAYS:?set WHEREIS_LEGAL_BACKUP_RETENTION_DAYS in .env}
      # How long a Google purchase token is kept after the account is gone, while the Play
      # cancellation is retried. PlayCancellationJanitor reads the SAME property, so the code and
      # the public page cannot drift — the coupling WHEREIS_LEGAL_BACKUP_RETENTION_DAYS already has
      # with db_backup.sh.
      WHEREIS_LEGAL_CANCELLATION_RETRY_DAYS: ${WHEREIS_LEGAL_CANCELLATION_RETRY_DAYS:?set WHEREIS_LEGAL_CANCELLATION_RETRY_DAYS in .env}
      # How long a Google Play billing notification stays in the RTDN ledger. Same coupling again:
      # PlayNotificationJanitor reads this property as its cutoff and both public pages state it.
      # A value of 7 or less is a STARTUP FAILURE, not a tuning choice — Pub/Sub can redeliver for
      # up to 7 days and the ledger's primary key is what makes that a no-op.
      WHEREIS_LEGAL_BILLING_LOG_RETENTION_DAYS: ${WHEREIS_LEGAL_BILLING_LOG_RETENTION_DAYS:?set WHEREIS_LEGAL_BILLING_LOG_RETENTION_DAYS in .env}
      AI_CLAUDE_WORKSPACE_ID: ${WHEREIS_AI_CLAUDE_WORKSPACE_ID:-}
      AI_CLAUDE_MAX_RETRIES: ${WHEREIS_AI_CLAUDE_MAX_RETRIES:-1}

      # ------------------------------------------------------------------ Play Billing
      #
      # WHICH OF THESE ARE REQUIRED AND WHY, because it changed and the reason matters.
      #
      # NONE of them is `:?` any more. They were, and that was correct while `google` was the only
      # value prod could run: the app declared them with no default, so a missing one failed
      # startup anyway and compose naming the variable was the better error. It is no longer
      # correct, because the values CANNOT EXIST YET — there is no Google Cloud service account and
      # no Pub/Sub topic — and `:?` on a value that cannot exist means `docker compose up -d` takes
      # the whole application down, free-tier users included, over a feature nobody can use.
      #
      # So billing has a third mode, `disabled`, and it is the default below. Under it purchase
      # verification answers 501 PLAY_BILLING_NOT_CONFIGURED, POST /play/rtdn rejects every caller,
      # and the three scheduled billing jobs do not run — it cannot grant a tier by any route.
      # Everything else is untouched: the free tier, GET /users/me/plan, per-tier limits and
      # 409 PLAN_LIMIT_REACHED all keep working. PLAY_PROVIDER=fake is still REFUSED under the
      # prod profile; do not reach for it to fix a boot failure, reach for `disabled`.
      #
      # THE CHECK COMPOSE USED TO MAKE NOW LIVES IN THE APPLICATION, because it is conditional and
      # `${VAR:?}` cannot express a condition:
      #   * provider=google with a blank key             -> PlayConfig fails startup
      #   * verifier=google with a blank secret/audience/email -> PlayRtdnConfig fails startup
      #   * `disabled` set on one half only              -> PlayBillingModeGuard fails startup
      # A typo in one of these variable names therefore still stops the container, loudly, naming
      # the property — it does not quietly produce a billing-shaped deployment with no credentials.
      #
      # TO SWITCH BILLING ON: set all six in .env (README Step 11e) and `up -d`. No image rebuild
      # and no code change — that is the whole point of the third value.
      PLAY_PROVIDER: ${WHEREIS_PLAY_PROVIDER:-disabled}
      # Safe default because it is this application's own id and must match the Play Console app.
      PLAY_PACKAGE_NAME: ${WHEREIS_PLAY_PACKAGE_NAME:-az.technest.whereis}
      # Read ONLY when PLAY_PROVIDER=google, and required at startup in that case.
      PLAY_SERVICE_ACCOUNT_JSON: ${WHEREIS_PLAY_SERVICE_ACCOUNT_JSON:-}

      # The RTDN push endpoint (V11). `disabled` denies every caller: the route stays where it is,
      # on its own @Order(0) security chain, and answers 401 with an empty body and no ledger row.
      # That is deliberately safer than deleting the route — the chain topology does not change
      # with configuration — and strictly safer than either other verifier, which by design accept
      # something.
      #
      # PlayRtdnConfig still refuses `fake` under the prod profile with its OWN Environment check,
      # deliberately not keyed on PLAY_PROVIDER, so a deployment running provider=google with the
      # verifier left unset is not silently unguarded.
      #
      # PLAY_RTDN_AUDIENCE must be the opaque audience string set explicitly on the Pub/Sub push
      # subscription (e.g. whereis-rtdn) and NEVER the push URL. Cloud Pub/Sub sets the `aud` claim
      # to the full endpoint URL — shared secret and all — when the subscription leaves the audience
      # blank; the app refuses to boot on a URL-shaped value for exactly that reason. See README
      # Step 11.
      PLAY_RTDN_VERIFIER: ${WHEREIS_PLAY_RTDN_VERIFIER:-disabled}
      PLAY_RTDN_SHARED_SECRET: ${WHEREIS_PLAY_RTDN_SHARED_SECRET:-}
      PLAY_RTDN_AUDIENCE: ${WHEREIS_PLAY_RTDN_AUDIENCE:-}
      PLAY_RTDN_SERVICE_ACCOUNT_EMAIL: ${WHEREIS_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:-}

      # The three scheduled billing components. All default to ON in application.yml, so these are
      # only here for the one operational answer they exist for: if whereis is ever scaled to more
      # than one container, turn all three OFF on every instance but one. Correctness survives two
      # instances — every write is idempotent and guarded by compare-and-set or write-once — but the
      # Play API quota spend doubles.
      #
      # These flags are irrelevant while PLAY_PROVIDER=disabled: the jobs check that FIRST and do
      # nothing, silently, whatever these say. They matter again the moment billing is switched on.
      PLAY_RECONCILE_ENABLED: ${WHEREIS_PLAY_RECONCILE_ENABLED:-true}
      PLAY_VOIDED_SWEEP_ENABLED: ${WHEREIS_PLAY_VOIDED_SWEEP_ENABLED:-true}
      PLAY_CANCELLATION_ENABLED: ${WHEREIS_PLAY_CANCELLATION_ENABLED:-true}

      # Tier limits. Deliberately NOT forwarded by default — the numbers in application.yml ARE the
      # product rule, and an unused knob in the compose file invites drift. Add these only when
      # Step 10's escape hatch is actually being used, and remember that raising a LOWER tier means
      # raising every tier above it or the container refuses to start:
      #   WHEREIS_PLANS_FREE_SPACES: ${WHEREIS_PLANS_FREE_SPACES:-1}
      #   WHEREIS_PLANS_FREE_ITEMS: ${WHEREIS_PLANS_FREE_ITEMS:-20}

      # Native Android clients do not send Origin, so this only matters if a web
      # client is added later. Keep it tight rather than permissive.
      # The public marketplace board's per-IP budgets. It also needs
      # `header_up X-Forwarded-For {remote_host}` in the Caddyfile (deploy/README.md Step 12a) —
      # without it the limiter is bypassed with one header and nothing fails loudly.
      WHEREIS_MARKET_READS_PER_MINUTE: ${WHEREIS_MARKET_READS_PER_MINUTE:-30}
      WHEREIS_MARKET_REPORTS_PER_HOUR: ${WHEREIS_MARKET_REPORTS_PER_HOUR:-5}

      # Who may block a seller (V13). A COLON-LESS default, deliberately: `:-` would substitute on
      # a blank value too, which is the same thing here — but the point is that BLANK IS A VALID
      # AND SAFE STATE. It means nobody may moderate, so there is no `:?` to add and no startup
      # refusal to write; the refusal that matters is the 403 at request time. Play's UGC policy
      # wants this SET before the board faces real users (deploy/README.md Step 12e).
      WHEREIS_MARKETPLACE_MODERATOR_EMAILS: ${WHEREIS_MARKETPLACE_MODERATOR_EMAILS-}

      CORS_ALLOWED_ORIGINS: ${WHEREIS_CORS_ALLOWED_ORIGINS:-https://${WHEREIS_API_HOST}}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

networks:
  # The network the AutoParts stack already created. Compose derives the name from
  # that project's directory, so it is `deploy_default` unless you ran it with -p.
  # Confirm with: docker network ls
  shared:
    external: true
    name: ${SHARED_NETWORK:-deploy_default}
